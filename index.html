<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甜甜的数学冒险 - 布鲁伊主题儿童数学学习</title>
    <style>
        /* 蓝布鲁伊主题色彩 */
        :root {
            --bluey-blue: #4A90D9;
            --bluey-light: #7AB8FF;
            --bluey-orange: #FF9F43;
            --bluey-pink: #FF6B9D;
            --bluey-green: #4CAF50;
            --bluey-yellow: #FFD93D;
            --bluey-purple: #9B59B6;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 主容器 */
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        /* 顶部导航 */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: var(--bluey-orange);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-text h1 {
            color: white;
            font-size: 1.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .logo-text p {
            color: rgba(255,255,255,0.8);
            font-size: 0.8em;
        }

        .user-stats {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
        }

        .stat-icon {
            font-size: 1.2em;
        }

        /* 主要内容区域 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* 角色面板 */
        .character-panel {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        .character-avatar {
            width: 150px;
            height: 150px;
            margin: 0 auto 15px;
            position: relative;
        }

        .avatar-body {
            width: 120px;
            height: 120px;
            background: var(--bluey-pink);
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .avatar-face {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 60px;
        }

        .eye {
            width: 15px;
            height: 20px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 10px;
        }

        .eye.left { left: 15px; }
        .eye.right { right: 15px; }

        .eye::after {
            content: '';
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
        }

        .mouth {
            width: 30px;
            height: 15px;
            border-bottom: 3px solid #333;
            border-radius: 0 0 50% 50%;
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* 冲天小辫子 */
        .pigtail {
            position: absolute;
            width: 25px;
            height: 60px;
            background: #333;
            border-radius: 12px;
            top: -40px;
        }

        .pigtail.left {
            left: 20px;
            transform: rotate(-15deg);
        }

        .pigtail.right {
            right: 20px;
            transform: rotate(15deg);
        }

        .pigtail::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 15px;
            background: var(--bluey-orange);
            border-radius: 50%;
        }

        .character-name {
            color: white;
            font-size: 1.5em;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .character-level {
            color: var(--bluey-yellow);
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .exp-bar {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }

        .exp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--bluey-green), var(--bluey-yellow));
            border-radius: 5px;
            transition: width 0.5s ease;
        }

        /* 游戏区域 */
        .game-area {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-title {
            color: white;
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .game-subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 1em;
        }

        /* 关卡选择 */
        .level-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .level-card {
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .level-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.3);
            border-color: var(--bluey-yellow);
        }

        .level-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .level-card.locked:hover {
            transform: none;
            border-color: transparent;
        }

        .level-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .level-name {
            color: white;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .level-desc {
            color: rgba(255,255,255,0.7);
            font-size: 0.8em;
        }

        .level-stars {
            margin-top: 10px;
            color: var(--bluey-yellow);
        }

        /* 游戏界面 */
        .game-screen {
            display: none;
            text-align: center;
        }

        .game-screen.active {
            display: block;
        }

        .question-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .question-text {
            font-size: 3em;
            color: #333;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
        }

        .option-btn {
            padding: 20px;
            font-size: 1.5em;
            border: 3px solid var(--bluey-blue);
            border-radius: 15px;
            background: white;
            color: var(--bluey-blue);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .option-btn:hover {
            background: var(--bluey-blue);
            color: white;
            transform: scale(1.05);
        }

        .option-btn.correct {
            background: var(--bluey-green);
            color: white;
            border-color: var(--bluey-green);
        }

        .option-btn.wrong {
            background: #e74c3c;
            color: white;
            border-color: #e74c3c;
        }

        /* 星星奖励 */
        .stars-reward {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .star {
            font-size: 2em;
            opacity: 0.3;
            transition: all 0.3s ease;
        }

        .star.earned {
            opacity: 1;
            animation: starPulse 0.5s ease;
        }

        @keyframes starPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--bluey-green), var(--bluey-yellow));
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        /* 音乐播放器 */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 15px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            display: none;
        }

        .music-player.active {
            display: flex;
        }

        .music-cover {
            width: 50px;
            height: 50px;
            background: var(--bluey-pink);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
        }

        .music-info {
            flex: 1;
        }

        .music-title {
            font-weight: bold;
            color: #333;
            font-size: 0.9em;
        }

        .music-artist {
            color: #666;
            font-size: 0.7em;
        }

        .music-controls {
            display: flex;
            gap: 10px;
        }

        .music-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: none;
            background: var(--bluey-blue);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            background: var(--bluey-orange);
            transform: scale(1.1);
        }

        /* 成就系统 */
        .achievements-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .achievements-panel.active {
            display: flex;
        }

        .achievements-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .achievements-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .achievements-title {
            color: white;
            font-size: 1.8em;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 2em;
            cursor: pointer;
        }

        .achievement-item {
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .achievement-item.unlocked {
            background: rgba(255,255,255,0.25);
            border-left: 4px solid var(--bluey-yellow);
        }

        .achievement-icon {
            font-size: 2em;
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .achievement-info h3 {
            color: white;
            margin-bottom: 5px;
        }

        .achievement-info p {
            color: rgba(255,255,255,0.7);
            font-size: 0.9em;
        }

        /* 音乐商店 */
        .music-shop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .music-shop.active {
            display: flex;
        }

        .shop-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .shop-title {
            color: white;
            font-size: 1.8em;
        }

        .shop-stars {
            color: var(--bluey-yellow);
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .songs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .song-card {
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .song-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.25);
        }

        .song-card.owned {
            border: 2px solid var(--bluey-green);
        }

        .song-cover {
            width: 80px;
            height: 80px;
            background: var(--bluey-orange);
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
        }

        .song-title {
            color: white;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .song-artist {
            color: rgba(255,255,255,0.7);
            font-size: 0.8em;
            margin-bottom: 10px;
        }

        .song-price {
            color: var(--bluey-yellow);
            font-weight: bold;
        }

        .song-price.owned {
            color: var(--bluey-green);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .level-select {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .options-container {
                grid-template-columns: 1fr;
            }
            
            .question-text {
                font-size: 2em;
            }
        }

        /* 动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .float {
            animation: float 3s ease-in-out infinite;
        }

        /* 弹窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .modal-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .modal-title {
            color: white;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .modal-text {
            color: rgba(255,255,255,0.8);
            margin-bottom: 20px;
        }

        .modal-btn {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;
        }

        .modal-btn.primary {
            background: var(--bluey-orange);
            color: white;
        }

        .modal-btn.secondary {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .modal-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 顶部导航 -->
        <nav class="top-nav">
            <div class="logo">
                <div class="logo-icon">🌟</div>
                <div class="logo-text">
                    <h1>甜甜的数学冒险</h1>
                    <p>布鲁伊主题 · 6-7岁数学学习</p>
                </div>
            </div>
            <div class="user-stats">
                <div class="stat-item">
                    <span class="stat-icon">⭐</span>
                    <span id="total-stars">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">🏆</span>
                    <span id="achievements-count">0/15</span>
                </div>
                <div class="stat-item" id="music-shop-btn">
                    <span class="stat-icon">🎵</span>
                    <span>音乐商店</span>
                </div>
                <div class="stat-item" id="achievements-btn">
                    <span class="stat-icon">🎖️</span>
                    <span>成就</span>
                </div>
            </div>
        </nav>

        <!-- 主要内容区域 -->
        <div class="main-content">
            <!-- 角色面板 -->
            <div class="character-panel">
                <div class="character-avatar">
                    <div class="avatar-body">
                        <div class="pigtail left"></div>
                        <div class="pigtail right"></div>
                        <div class="avatar-face">
                            <div class="eye left"></div>
                            <div class="eye right"></div>
                            <div class="mouth"></div>
                        </div>
                    </div>
                </div>
                <h2 class="character-name">甜甜</h2>
                <p class="character-level">等级: <span id="character-level">1</span></p>
                <div class="exp-bar">
                    <div class="exp-fill" id="exp-fill" style="width: 0%"></div>
                </div>
                <p style="color: rgba(255,255,255,0.7); font-size: 0.8em;">
                    经验: <span id="current-exp">0</span> / <span id="max-exp">100</span>
                </p>
                <div style="margin-top: 20px;">
                    <h3 style="color: white; margin-bottom: 10px;">今日任务</h3>
                    <div style="background: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; text-align: left;">
                        <p style="color: rgba(255,255,255,0.8); font-size: 0.9em;">🎯 完成3个关卡</p>
                        <p style="color: rgba(255,255,255,0.8); font-size: 0.9em;">⭐ 收集5颗星星</p>
                        <p style="color: rgba(255,255,255,0.8); font-size: 0.9em;">🎵 解锁1首新歌</p>
                    </div>
                </div>
            </div>

            <!-- 游戏区域 -->
            <div class="game-area">
                <div class="game-header">
                    <h2 class="game-title">🎮 数学闯关大冒险</h2>
                    <p class="game-subtitle">完成关卡收集星星，解锁世界名曲！</p>
                </div>

                <!-- 关卡选择 -->
                <div class="level-select" id="level-select">
                    <!-- 关卡会通过 JavaScript 动态生成 -->
                </div>

                <!-- 游戏界面 -->
                <div class="game-screen" id="game-screen">
                    <div class="stars-reward" id="stars-reward">
                        <span class="star">⭐</span>
                        <span class="star">⭐</span>
                        <span class="star">⭐</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="question-container">
                        <p class="question-text" id="question-text">3 + 2 = ?</p>
                        <div class="options-container" id="options-container">
                            <!-- 选项会通过 JavaScript 动态生成 -->
                        </div>
                    </div>
                    <div style="margin-top: 20px;">
                        <button class="modal-btn secondary" id="back-to-levels">返回关卡</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 音乐播放器 -->
        <div class="music-player" id="music-player">
            <div class="music-cover">🎵</div>
            <div class="music-info">
                <div class="music-title" id="music-title">欢乐颂</div>
                <div class="music-artist" id="music-artist">贝多芬</div>
            </div>
            <div class="music-controls">
                <button class="music-btn" id="prev-song">⏮</button>
                <button class="music-btn" id="play-pause">▶</button>
                <button class="music-btn" id="next-song">⏭</button>
            </div>
        </div>

        <!-- 成就面板 -->
        <div class="achievements-panel" id="achievements-panel">
            <div class="achievements-content">
                <div class="achievements-header">
                    <h2 class="achievements-title">🏆 成就系统</h2>
                    <button class="close-btn" id="close-achievements">×</button>
                </div>
                <div id="achievements-list">
                    <!-- 成就会通过 JavaScript 动态生成 -->
                </div>
            </div>
        </div>

        <!-- 音乐商店 -->
        <div class="music-shop" id="music-shop">
            <div class="shop-content">
                <div class="shop-header">
                    <h2 class="shop-title">🎵 乐乐的音乐商店</h2>
                    <div class="shop-stars">
                        <span>⭐</span>
                        <span id="shop-stars-count">0</span>
                    </div>
                    <button class="close-btn" id="close-shop">×</button>
                </div>
                <p style="color: rgba(255,255,255,0.8); margin-bottom: 20px;">
                    用星星换取世界名曲，让乐乐为你唱歌！
                </p>
                <div class="songs-grid" id="songs-grid">
                    <!-- 歌曲会通过 JavaScript 动态生成 -->
                </div>
            </div>
        </div>

        <!-- 弹窗 -->
        <div class="modal" id="modal">
            <div class="modal-content">
                <div class="modal-icon" id="modal-icon">🎉</div>
                <h2 class="modal-title" id="modal-title">恭喜过关！</h2>
                <p class="modal-text" id="modal-text">你获得了 3 颗星星！</p>
                <div id="modal-buttons">
                    <button class="modal-btn primary" id="modal-primary-btn">继续</button>
                    <button class="modal-btn secondary" id="modal-secondary-btn">返回</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 游戏状态
        const gameState = {
            stars: 0,
            level: 1,
            exp: 0,
            maxExp: 100,
            achievements: [],
            ownedSongs: [],
            currentLevel: null,
            currentQuestion: 0,
            totalQuestions: 10,
            correctAnswers: 0,
            levelStars: 0
        };

        // 关卡配置
        const levels = [
            {
                id: 1,
                name: "数字认知",
                icon: "🔢",
                desc: "认识数字1-10",
                type: "counting",
                difficulty: 1,
                unlocked: true,
                stars: 0
            },
            {
                id: 2,
                name: "基础加法",
                icon: "➕",
                desc: "10以内加法",
                type: "addition",
                difficulty: 1,
                unlocked: true,
                stars: 0
            },
            {
                id: 3,
                name: "基础减法",
                icon: "➖",
                desc: "10以内减法",
                type: "subtraction",
                difficulty: 1,
                unlocked: true,
                stars: 0
            },
            {
                id: 4,
                name: "数字排序",
                icon: "📊",
                desc: "从小到大排列",
                type: "ordering",
                difficulty: 2,
                unlocked: false,
                stars: 0
            },
            {
                id: 5,
                name: "图形计数",
                icon: "🔷",
                desc: "数一数图形",
                type: "shapes",
                difficulty: 2,
                unlocked: false,
                stars: 0
            },
            {
                id: 6,
                name: "进阶加法",
                icon: "➕",
                desc: "20以内加法",
                type: "addition",
                difficulty: 2,
                unlocked: false,
                stars: 0
            },
            {
                id: 7,
                name: "进阶减法",
                icon: "➖",
                desc: "20以内减法",
                type: "subtraction",
                difficulty: 2,
                unlocked: false,
                stars: 0
            },
            {
                id: 8,
                name: "数字迷宫",
                icon: "🏰",
                desc: "找到正确答案",
                type: "maze",
                difficulty: 3,
                unlocked: false,
                stars: 0
            },
            {
                id: 9,
                name: "数学接龙",
                icon: "🐉",
                desc: "连续计算",
                type: "sequence",
                difficulty: 3,
                unlocked: false,
                stars: 0
            },
            {
                id: 10,
                name: "终极挑战",
                icon: "👑",
                desc: "综合测试",
                type: "mixed",
                difficulty: 3,
                unlocked: false,
                stars: 0
            }
        ];

        // 成就配置
        const achievements = [
            { id: 1, name: "初次冒险", desc: "完成第一个关卡", icon: "🎯", condition: () => gameState.level >= 2 },
            { id: 2, name: "数学小达人", desc: "完成5个关卡", icon: "⭐", condition: () => gameState.level >= 6 },
            { id: 3, name: "星星收集者", desc: "收集10颗星星", icon: "🌟", condition: () => gameState.stars >= 10 },
            { id: 4, name: "音乐爱好者", desc: "解锁第一首歌", icon: "🎵", condition: () => gameState.ownedSongs.length >= 1 },
            { id: 5, name: "完美通关", desc: "一个关卡获得3星", icon: "💎", condition: () => levels.some(l => l.stars === 3) },
            { id: 6, name: "连续答对", desc: "连续答对10题", icon: "🔥", condition: () => false },
            { id: 7, name: "速度之星", desc: "30秒内完成一关", icon: "⚡", condition: () => false },
            { id: 8, name: "数学大师", desc: "完成所有关卡", icon: "👑", condition: () => gameState.level > 10 },
            { id: 9, name: "收藏家", desc: "解锁5首歌曲", icon: "🎶", condition: () => gameState.ownedSongs.length >= 5 },
            { id: 10, name: "等级达人", desc: "达到等级5", icon: "📈", condition: () => gameState.characterLevel >= 5 },
            { id: 11, name: "加法高手", desc: "完成所有加法关卡", icon: "➕", condition: () => false },
            { id: 12, name: "减法高手", desc: "完成所有减法关卡", icon: "➖", condition: () => false },
            { id: 13, name: "图形专家", desc: "完成图形关卡", icon: "🔷", condition: () => false },
            { id: 14, name: "迷宫探险家", desc: "完成迷宫关卡", icon: "🏰", condition: () => false },
            { id: 15, name: "全能冠军", desc: "解锁所有成就", icon: "🏆", condition: () => gameState.achievements.length >= 14 }
        ];

        // 世界名曲配置
        const songs = [
            { id: 1, name: "欢乐颂", artist: "贝多芬", price: 5, owned: false, icon: "🎼" },
            { id: 2, name: "小星星变奏曲", artist: "莫扎特", price: 5, owned: false, icon: "⭐" },
            { id: 3, name: "卡农", artist: "帕赫贝尔", price: 8, owned: false, icon: "🎻" },
            { id: 4, name: "蓝色多瑙河", artist: "小约翰·施特劳斯", price: 8, owned: false, icon: "🌊" },
            { id: 5, name: "春之声圆舞曲", artist: "小约翰·施特劳斯", price: 10, owned: false, icon: "🌸" },
            { id: 6, name: "土耳其进行曲", artist: "莫扎特", price: 10, owned: false, icon: "🎺" },
            { id: 7, name: "月光奏鸣曲", artist: "贝多芬", price: 12, owned: false, icon: "🌙" },
            { id: 8, name: "四季·春", artist: "维瓦尔第", price: 12, owned: false, icon: "🌷" },
            { id: 9, name: "胡桃夹子组曲", artist: "柴可夫斯基", price: 15, owned: false, icon: "🩰" },
            { id: 10, name: "天鹅湖", artist: "柴可夫斯基", price: 15, owned: false, icon: "🦢" },
            { id: 11, name: "梦幻曲", artist: "舒曼", price: 18, owned: false, icon: "💫" },
            { id: 12, name: "致爱丽丝", artist: "贝多芬", price: 18, owned: false, icon: "🌹" }
        ];

        // 音乐播放器状态
        let currentSong = null;
        let isPlaying = false;

        // 初始化游戏
        function initGame() {
            renderLevels();
            updateStats();
            setupEventListeners();
            checkAchievements();
        }

        // 渲染关卡
        function renderLevels() {
            const levelSelect = document.getElementById('level-select');
            levelSelect.innerHTML = '';

            levels.forEach(level => {
                const levelCard = document.createElement('div');
                levelCard.className = `level-card ${level.unlocked ? '' : 'locked'}`;
                levelCard.innerHTML = `
                    <div class="level-icon">${level.icon}</div>
                    <div class="level-name">${level.name}</div>
                    <div class="level-desc">${level.desc}</div>
                    <div class="level-stars">
                        ${'⭐'.repeat(level.stars)}${'☆'.repeat(3 - level.stars)}
                    </div>
                `;
                levelCard.onclick = () => startLevel(level.id);
                levelSelect.appendChild(levelCard);
            });
        }

        // 更新统计信息
        function updateStats() {
            document.getElementById('total-stars').textContent = gameState.stars;
            document.getElementById('achievements-count').textContent = 
                `${gameState.achievements.length}/${achievements.length}`;
            document.getElementById('character-level').textContent = 
                Math.floor(gameState.level / 3) + 1;
            document.getElementById('current-exp').textContent = gameState.exp;
            document.getElementById('max-exp').textContent = gameState.maxExp;
            document.getElementById('exp-fill').style.width = 
                `${(gameState.exp / gameState.maxExp) * 100}%`;
            document.getElementById('shop-stars-count').textContent = gameState.stars;
        }

        // 开始关卡
        function startLevel(levelId) {
            const level = levels.find(l => l.id === levelId);
            if (!level || !level.unlocked) return;

            gameState.currentLevel = level;
            gameState.currentQuestion = 0;
            gameState.correctAnswers = 0;
            gameState.levelStars = 0;

            document.getElementById('level-select').style.display = 'none';
            document.getElementById('game-screen').classList.add('active');
            document.getElementById('game-screen').style.display = 'block';

            generateQuestion();
        }

        // 生成题目
        function generateQuestion() {
            if (gameState.currentQuestion >= gameState.totalQuestions) {
                endLevel();
                return;
            }

            gameState.currentQuestion++;
            document.getElementById('progress-fill').style.width = 
                `${(gameState.currentQuestion / gameState.totalQuestions) * 100}%`;

            const level = gameState.currentLevel;
            let question, answer, options;

            switch (level.type) {
                case 'counting':
                    const num = Math.floor(Math.random() * 10) + 1;
                    question = `数一数，有几个苹果？ 🍎`.repeat(num).slice(0, -2);
                    answer = num;
                    break;
                case 'addition':
                    const a1 = Math.floor(Math.random() * (level.difficulty * 10));
                    const b1 = Math.floor(Math.random() * (level.difficulty * 10 - a1));
                    question = `${a1} + ${b1} = ?`;
                    answer = a1 + b1;
                    break;
                case 'subtraction':
                    const a2 = Math.floor(Math.random() * (level.difficulty * 10)) + 1;
                    const b2 = Math.floor(Math.random() * a2);
                    question = `${a2} - ${b2} = ?`;
                    answer = a2 - b2;
                    break;
                case 'ordering':
                    const nums = Array.from({length: 3}, () => 
                        Math.floor(Math.random() * 10) + 1
                    ).sort((a, b) => a - b);
                    question = `从小到大排列: ${nums[2]}, ${nums[0]}, ${nums[1]}`;
                    answer = nums.join(',');
                    break;
                case 'shapes':
                    const shapes = ['🔴', '🔵', '🟢', '🟡'];
                    const shape = shapes[Math.floor(Math.random() * shapes.length)];
                    const count = Math.floor(Math.random() * 5) + 1;
                    question = `数一数有几个${shape}？ ${shape.repeat(count)}`;
                    answer = count;
                    break;
                case 'maze':
                    const target = Math.floor(Math.random() * 20) + 1;
                    question = `找到数字 ${target}`;
                    answer = target;
                    break;
                case 'sequence':
                    const start = Math.floor(Math.random() * 5) + 1;
                    const step = Math.floor(Math.random() * 3) + 1;
                    const seq = Array.from({length: 4}, (_, i) => start + i * step);
                    question = `找规律: ${seq[0]}, ${seq[1]}, ${seq[2]}, ?`;
                    answer = seq[3];
                    break;
                case 'mixed':
                    const op = Math.random() > 0.5 ? '+' : '-';
                    const x = Math.floor(Math.random() * 15) + 1;
                    const y = op === '+' ? 
                        Math.floor(Math.random() * (15 - x)) : 
                        Math.floor(Math.random() * x);
                    question = `${x} ${op} ${y} = ?`;
                    answer = op === '+' ? x + y : x - y;
                    break;
                default:
                    question = "1 + 1 = ?";
                    answer = 2;
            }

            document.getElementById('question-text').textContent = question;

            // 生成选项
            options = [answer];
            while (options.length < 4) {
                let option;
                if (typeof answer === 'number') {
                    option = answer + Math.floor(Math.random() * 10) - 5;
                    if (option < 0) option = answer + Math.floor(Math.random() * 5) + 1;
                } else {
                    continue;
                }
                if (!options.includes(option) && option !== answer) {
                    options.push(option);
                }
            }

            options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option, answer, btn);
                optionsContainer.appendChild(btn);
            });
        }

        // 检查答案
        function checkAnswer(selected, correct, btn) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);

            if (selected === correct) {
                btn.classList.add('correct');
                gameState.correctAnswers++;
                gameState.levelStars = Math.min(3, Math.ceil(
                    (gameState.correctAnswers / gameState.totalQuestions) * 3
                ));
                
                // 更新星星显示
                const stars = document.querySelectorAll('.star');
                stars.forEach((star, index) => {
                    if (index < gameState.levelStars) {
                        star.classList.add('earned');
                    }
                });

                // 增加经验
                gameState.exp += 10;
                if (gameState.exp >= gameState.maxExp) {
                    gameState.exp = 0;
                    gameState.maxExp += 50;
                    gameState.level++;
                }
            } else {
                btn.classList.add('wrong');
                // 显示正确答案
                buttons.forEach(b => {
                    if (parseInt(b.textContent) === correct) {
                        b.classList.add('correct');
                    }
                });
            }

            setTimeout(() => {
                generateQuestion();
            }, 1000);
        }

        // 结束关卡
        function endLevel() {
            const level = gameState.currentLevel;
            const stars = gameState.levelStars;

            // 更新关卡星星
            level.stars = Math.max(level.stars, stars);

            // 增加总星星
            gameState.stars += stars;

            // 解锁下一关卡
            const nextLevel = levels.find(l => l.id === level.id + 1);
            if (nextLevel && stars >= 2) {
                nextLevel.unlocked = true;
            }

            // 检查成就
            checkAchievements();

            // 显示结果弹窗
            showModal(
                stars >= 2 ? '🎉' : '😢',
                stars >= 2 ? '恭喜过关！' : '继续努力！',
                `你获得了 ${stars} 颗星星！`,
                [
                    { text: '返回关卡', primary: true, action: backToLevels },
                    { text: '再玩一次', primary: false, action: () => startLevel(level.id) }
                ]
            );

            updateStats();
        }

        // 返回关卡选择
        function backToLevels() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('level-select').style.display = 'grid';
            renderLevels();
            hideModal();
        }

        // 显示弹窗
        function showModal(icon, title, text, buttons) {
            document.getElementById('modal-icon').textContent = icon;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-text').textContent = text;
            
            const buttonsContainer = document.getElementById('modal-buttons');
            buttonsContainer.innerHTML = '';
            
            buttons.forEach(btn => {
                const button = document.createElement('button');
                button.className = `modal-btn ${btn.primary ? 'primary' : 'secondary'}`;
                button.textContent = btn.text;
                button.onclick = btn.action;
                buttonsContainer.appendChild(button);
            });

            document.getElementById('modal').classList.add('active');
        }

        // 隐藏弹窗
        function hideModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // 检查成就
        function checkAchievements() {
            achievements.forEach(achievement => {
                if (!gameState.achievements.includes(achievement.id) && achievement.condition()) {
                    gameState.achievements.push(achievement.id);
                    showAchievementUnlock(achievement);
                }
            });
            updateStats();
        }

        // 显示成就解锁
        function showAchievementUnlock(achievement) {
            showModal(
                achievement.icon,
                '成就解锁！',
                `${achievement.name}: ${achievement.desc}`,
                [{ text: '太棒了！', primary: true, action: hideModal }]
            );
        }

        // 渲染成就列表
        function renderAchievements() {
            const list = document.getElementById('achievements-list');
            list.innerHTML = '';

            achievements.forEach(achievement => {
                const item = document.createElement('div');
                item.className = `achievement-item ${gameState.achievements.includes(achievement.id) ? 'unlocked' : ''}`;
                item.innerHTML = `
                    <div class="achievement-icon">${achievement.icon}</div>
                    <div class="achievement-info">
                        <h3>${achievement.name}</h3>
                        <p>${achievement.desc}</p>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        // 渲染音乐商店
        function renderMusicShop() {
            const grid = document.getElementById('songs-grid');
            grid.innerHTML = '';

            songs.forEach(song => {
                const card = document.createElement('div');
                card.className = `song-card ${song.owned ? 'owned' : ''}`;
                card.innerHTML = `
                    <div class="song-cover">${song.icon}</div>
                    <div class="song-title">${song.name}</div>
                    <div class="song-artist">${song.artist}</div>
                    <div class="song-price ${song.owned ? 'owned' : ''}">
                        ${song.owned ? '✅ 已拥有' : `⭐ ${song.price}`}
                    </div>
                `;
                card.onclick = () => buySong(song.id);
                grid.appendChild(card);
            });
        }

        // 购买歌曲
        function buySong(songId) {
            const song = songs.find(s => s.id === songId);
            if (!song || song.owned) return;

            if (gameState.stars >= song.price) {
                gameState.stars -= song.price;
                song.owned = true;
                gameState.ownedSongs.push(song.id);
                checkAchievements();
                updateStats();
                renderMusicShop();
                showModal(
                    '🎵',
                    '购买成功！',
                    `你已解锁《${song.name}》`,
                    [{ text: '播放', primary: true, action: () => { playSong(songId); hideModal(); } }]
                );
            } else {
                showModal(
                    '😢',
                    '星星不足',
                    `需要 ${song.price} 颗星星，你只有 ${gameState.stars} 颗`,
                    [{ text: '知道了', primary: true, action: hideModal }]
                );
            }
        }

        // 播放歌曲
        function playSong(songId) {
            const song = songs.find(s => s.id === songId);
            if (!song || !song.owned) return;

            currentSong = song;
            isPlaying = true;

            document.getElementById('music-title').textContent = song.name;
            document.getElementById('music-artist').textContent = song.artist;
            document.getElementById('play-pause').textContent = '⏸';
            document.getElementById('music-player').classList.add('active');

            // 模拟播放（实际项目中应使用 Web Audio API）
            showModal(
                '🎵',
                `正在播放: ${song.name}`,
                `艺术家: ${song.artist}\n\n（这是演示版本，实际项目中会播放真实音乐）`,
                [{ text: '关闭', primary: true, action: hideModal }]
            );
        }

        // 设置事件监听器
        function setupEventListeners() {
            document.getElementById('back-to-levels').onclick = backToLevels;
            document.getElementById('achievements-btn').onclick = () => {
                renderAchievements();
                document.getElementById('achievements-panel').classList.add('active');
            };
            document.getElementById('close-achievements').onclick = () => {
                document.getElementById('achievements-panel').classList.remove('active');
            };
            document.getElementById('music-shop-btn').onclick = () => {
                renderMusicShop();
                document.getElementById('music-shop').classList.add('active');
            };
            document.getElementById('close-shop').onclick = () => {
                document.getElementById('music-shop').classList.remove('active');
            };
            document.getElementById('play-pause').onclick = () => {
                isPlaying = !isPlaying;
                document.getElementById('play-pause').textContent = isPlaying ? '⏸' : '▶';
            };
            document.getElementById('prev-song').onclick = () => {
                if (currentSong) {
                    const index = songs.findIndex(s => s.id === currentSong.id);
                    const prevSong = songs[(index - 1 + songs.length) % songs.length];
                    if (prevSong.owned) playSong(prevSong.id);
                }
            };
            document.getElementById('next-song').onclick = () => {
                if (currentSong) {
                    const index = songs.findIndex(s => s.id === currentSong.id);
                    const nextSong = songs[(index + 1) % songs.length];
                    if (nextSong.owned) playSong(nextSong.id);
                }
            };
        }

        // 启动游戏
        initGame();
    </script>
</body>
</html>
